apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../default
- certmanager

images:
- name: controller
  newName: quay.io/medik8s/node-healthcheck-operator
  newTag: v5.8.0

patches:
- path: manager_webhook_patch.yaml
- path: webhookcainjection_patch.yaml

replacements:
- source:
    fieldPath: metadata.name
    kind: Service
    name: node-healthcheck-webhook-service
  targets:
  - fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: .
    select:
      kind: Certificate
      name: node-healthcheck-serving-cert
- source:
    fieldPath: metadata.namespace
    kind: Service
    name: node-healthcheck-webhook-service
  targets:
  - fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: .
      index: 1
    select:
      kind: Certificate
      name: node-healthcheck-serving-cert
- source:
    fieldPath: metadata.namespace
    kind: Certificate
    name: node-healthcheck-serving-cert
  targets:
  - fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
    select:
      kind: ValidatingWebhookConfiguration
- source:
    fieldPath: metadata.name
    kind: Certificate
    name: node-healthcheck-serving-cert
  targets:
  - fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 1
    select:
      kind: ValidatingWebhookConfiguration
