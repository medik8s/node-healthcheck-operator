name: Post Submit
on:
  push:
    branches:
      - main
      - 'release-*'
      - 'medik8s-*'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  push_to_registry:
    uses: medik8s/.github/.github/workflows/post_submit.yaml@main
    with:
      make_targets: container-build-k8s container-push
      make_vars: CONTAINER_TOOL=docker
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
