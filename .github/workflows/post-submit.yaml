name: Post Submit
on:
  push:
    branches:
      # the development branch, publishes the floating "latest" tag
      - main
      # version branches, each publishes its own "v<version>" tag
      - 'medik8s-*'

jobs:
  push_to_registry:
    # Shared by all medik8s operators, see
    # https://github.com/medik8s/.github/blob/main/.github/workflows/post_submit.yaml
    uses: medik8s/.github/.github/workflows/post_submit.yaml@main
    secrets: inherit
    with:
      make_targets: "container-build-k8s container-push"
