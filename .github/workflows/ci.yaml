# CI workflow for medik8s operators.
#
# Runs three parallel jobs: verify, unit-test, and container-build.
# Each job detects available Makefile targets and skips gracefully
# when a target is missing, so it works across all medik8s operators.
#
# Designed to be moved to medik8s/.github as a reusable workflow:
#   1. Remove the push/pull_request triggers below
#   2. Each operator calls it with:
#      uses: medik8s/.github/.github/workflows/ci.yaml@main
name: CI

on:
  push:
    branches: [main*, release-*]
  pull_request:
    branches: [main*, release-*]
  # Ready for reuse from other repos once moved to medik8s/.github
  workflow_call: {}

permissions:
  contents: read

jobs:
  verify:
    name: Lint & Verify
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Check import sorting
      run: |
        if make -n test-imports >/dev/null 2>&1; then
          make test-imports
        else
          echo "target 'test-imports' not found, skipping"
        fi

    - name: Verify vendor
      run: |
        if make -n verify-vendor >/dev/null 2>&1; then
          make verify-vendor
        else
          echo "target 'verify-vendor' not found, skipping"
        fi

    - name: Verify bundle
      run: |
        has_target() { make -n "$1" >/dev/null 2>&1; }

        if has_target verify-bundle; then
          # SNR, FAR style: single target that regenerates and checks for drift
          make verify-bundle
        elif has_target manifests && has_target bundle-reset; then
          # NHC style: regenerate manifests and bundle, reset versions, check for drift
          make manager manifests bundle-k8s bundle-reset
          if has_target verify; then
            make verify
          fi
        else
          echo "no bundle verification targets found, skipping"
        fi

    - name: Run go vet
      run: |
        if make -n vet >/dev/null 2>&1; then
          make vet
        else
          echo "target 'vet' not found, skipping"
        fi

  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run unit tests
      run: |
        if make -n test >/dev/null 2>&1; then
          make test
        else
          echo "target 'test' not found, skipping"
        fi

  container-build:
    name: Container Build
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build container images
      env:
        # Skip unit tests during container build — they run in a separate job.
        NHC_SKIP_TEST: "true"
      run: |
        has_target() { make -n "$1" >/dev/null 2>&1; }
        built=false

        for target in container-build-k8s container-build-ocp container-build-community container-build-metrics; do
          if has_target "$target"; then
            echo "=== Building: $target ==="
            make "$target"
            built=true
          fi
        done

        if [ "$built" = false ]; then
          if has_target docker-build; then
            echo "=== Building: docker-build ==="
            make docker-build
          else
            echo "No container build target found, skipping"
          fi
        fi
